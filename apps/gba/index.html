<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0d0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GBA</title>
  <style>
    :root{--bg:#0d0f1a;--panel:#161a2c;--line:#2a3050;--text:#eef0ff;--dim:#8f96bd;--accent:#7c5cff;--accent2:#ff5db1;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    #root{min-height:100vh;min-height:100dvh;}
    button{font-family:inherit;color:inherit;}
    canvas{image-rendering:pixelated;image-rendering:crisp-edges;}
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- The emulator core is Rust compiled to WebAssembly, in assets/. ROMs and
       saves never leave the device: both live in this browser's IndexedDB. -->
  <script src="bundle.js"></script>
</body>
</html>
