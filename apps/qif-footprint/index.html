<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20201F">
<title>QIF Footprint Editor</title>
<style>
:root{--inf:#CD0A1B;--infd:#B80918;--bolt:#F0941C;--boltd:#C8760A;--md:#7A4DA0;
--ink:#1A1A1A;--ink2:#4A4A4A;--mut:#8B8B8B;--line:#DADADA;--panel:#FFFFFF;--shell:#20201F;--shell2:#2C2B2A;--shell3:#3A3938;
--sfill:#E9E9E9;--sstroke:#CBCBCB;--lead:#AFAFAF;
--ui:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--shell);color:#E8E7E6;font:13px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:grid;grid-template-columns:342px 1fr;height:100vh}
/* ---------- rail ---------- */
.rail{background:var(--shell2);border-right:1px solid #000;display:flex;flex-direction:column;min-height:0}
.rhead{padding:14px 16px 12px;border-bottom:1px solid var(--shell3);display:flex;align-items:center;gap:9px}
.rhead .bar{width:3px;height:26px;background:var(--inf);border-radius:2px}
.rhead h1{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.rhead p{font-size:10.5px;color:#8B8A88;letter-spacing:.02em;margin-top:2px}
.tabs{display:flex;border-bottom:1px solid var(--shell3);background:#262524}
.tab{flex:1;padding:9px 6px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
color:#8B8A88;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer}
.tab[aria-selected=true]{color:#fff;border-bottom-color:var(--inf);background:var(--shell2)}
.tab:focus-visible{outline:2px solid var(--bolt);outline-offset:-2px}
.pane{flex:1;overflow-y:auto;padding:12px 14px 40px;min-height:0}
.pane::-webkit-scrollbar{width:9px}.pane::-webkit-scrollbar-thumb{background:#4A4948;border-radius:5px}
.hint{font-size:10.5px;color:#8B8A88;margin-bottom:10px;line-height:1.5}
/* site cards */
.site{background:#262524;border:1px solid var(--shell3);border-left:3px solid var(--mut);border-radius:6px;padding:9px 10px;margin-bottom:7px;cursor:pointer}
.site:hover{border-color:#585756}
.site.sel{border-color:var(--bolt);background:#2E2C29}
.site .top{display:flex;align-items:baseline;gap:6px}
.site .nm{font-size:12px;font-weight:700;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site .pill{font-size:8.5px;font-weight:700;letter-spacing:.06em;padding:2px 5px;border-radius:3px;text-transform:uppercase}
.site .loc{font-size:10.5px;color:#9C9B99;margin-top:2px}
.site .sf{font-family:var(--mono);font-size:9.5px;margin-top:3px;letter-spacing:.03em}
.ed{margin-top:9px;padding-top:9px;border-top:1px dashed var(--shell3);display:grid;gap:7px}
label{display:block;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8B8A88;margin-bottom:3px}
input,select{width:100%;background:#1C1B1A;border:1px solid #454443;color:#F0EFEE;border-radius:4px;padding:6px 8px;font:12px var(--ui)}
input:focus,select:focus{outline:none;border-color:var(--bolt)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.typ{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:30;background:#1C1B1A;border:1px solid #55534F;border-top:0;
border-radius:0 0 5px 5px;max-height:186px;overflow-y:auto;box-shadow:0 12px 26px rgba(0,0,0,.6)}
.sug div{padding:6px 9px;font-size:11.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.sug div:hover,.sug div.on{background:#38352F}
.sug .st{color:#8B8A88;font-family:var(--mono);font-size:10px}
.btn{background:#3A3938;border:1px solid #4E4D4C;color:#EDECEB;border-radius:5px;padding:7px 10px;
font:600 11px var(--ui);letter-spacing:.05em;cursor:pointer}
.btn:hover{background:#474645}.btn:focus-visible{outline:2px solid var(--bolt);outline-offset:1px}
.btn.pri{background:var(--inf);border-color:var(--inf);color:#fff}.btn.pri:hover{background:var(--infd)}
.btn.dgr{color:#FF8A93;border-color:#5E3034}.btn.dgr:hover{background:#3A2426}
.btn.sm{padding:5px 8px;font-size:10px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.leg{background:#262524;border:1px solid var(--shell3);border-radius:6px;padding:9px 10px;margin-bottom:7px}
.sw{width:20px;height:20px;border-radius:50%;border:0;cursor:pointer;flex:0 0 auto}
.nudge{display:grid;grid-template-columns:repeat(3,28px);gap:3px;justify-content:center;margin-top:2px}
.nudge button{background:#1C1B1A;border:1px solid #454443;color:#CFCECD;border-radius:4px;height:24px;cursor:pointer;font-size:11px}
.nudge button:hover{background:#33322F;border-color:var(--bolt)}
/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;min-width:0;background:#1A1918}
.bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid #000;background:#232221}
.bar .sp{flex:1}
.chip{font-size:10px;font-family:var(--mono);color:#9C9B99;background:#1A1918;border:1px solid var(--shell3);padding:4px 8px;border-radius:4px}
.chip b{color:#fff}
.ok{color:#7FD69B}.warn{color:#FFC46B}
.canvas-wrap{flex:1;overflow:auto;display:grid;place-items:center;padding:20px;min-height:0}
#slide{width:1280px;height:720px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.6);flex:0 0 auto}
.card-g{cursor:grab}.card-g.drag{cursor:grabbing}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;border:1px solid var(--shell3);
color:#fff;padding:9px 16px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- gate ---------- */
.app{display:none}
body.unlocked .app{display:grid}
.gate{position:fixed;inset:0;z-index:100;background:var(--shell);display:grid;place-items:center;padding:24px}
body.unlocked .gate{display:none}
.gate form{width:100%;max-width:312px;background:var(--shell2);border:1px solid var(--shell3);border-radius:8px;padding:22px}
.gate .bar{width:3px;height:26px;background:var(--inf);border-radius:2px}
.gate .gh{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.gate h1{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.gate p{font-size:10.5px;color:#8B8A88;letter-spacing:.02em;margin-top:2px}
.gate .btn{width:100%;margin-top:10px;padding:9px}
.gate .err{font-size:11px;color:#FF8A93;margin-top:9px;min-height:15px}
.gate .btn[disabled]{opacity:.6;cursor:default}
#save[data-s=conflict]{cursor:pointer;border-color:#5E4A30}
</style></head><body>
<div class="gate" id="gate">
  <form id="gateForm">
    <div class="gh"><div class="bar"></div><div>
      <h1>Footprint Editor</h1><p>Quanta Integrated Fabrication</p></div></div>
    <label for="gatePw">Passphrase</label>
    <input id="gatePw" type="password" autocomplete="current-password" autofocus>
    <button class="btn pri" type="submit">Unlock</button>
    <div class="err" id="gateErr" role="alert"></div>
  </form>
</div>
<div class="app">
 <aside class="rail">
  <div class="rhead"><div class="bar"></div><div>
    <h1>Footprint Editor</h1><p>Quanta Integrated Fabrication</p></div></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-t="sites">Sites</button>
    <button class="tab" role="tab" aria-selected="false" data-t="legend">Legend</button>
    <button class="tab" role="tab" aria-selected="false" data-t="text">Text</button>
    <button class="tab" role="tab" aria-selected="false" data-t="data">Data</button>
  </div>
  <div class="pane" id="pane"></div>
 </aside>
 <main class="stage">
  <div class="bar">
    <button class="btn pri" id="addBtn">Add site</button>
    <button class="btn" id="autoBtn" title="Move overlapping labels apart">Auto-arrange labels</button>
    <span class="sp"></span>
    <span class="chip" id="stat"></span>
    <span class="chip" id="coll"></span>
    <span class="chip" id="save"></span>
    <button class="btn" id="svgBtn">Download SVG</button>
    <button class="btn" id="pngBtn">Download PNG</button>
  </div>
  <div class="canvas-wrap"><svg id="slide" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg></div>
 </main>
</div>
<div class="toast" id="toast"></div>

const DEG=Math.PI/180,p1=29.5*DEG,p2=45.5*DEG,p0=37.5*DEG,l0=-96*DEG;
const nn=(Math.sin(p1)+Math.sin(p2))/2, Cc=Math.cos(p1)**2+2*nn*Math.sin(p1), rho0=Math.sqrt(Cc-2*nn*Math.sin(p0))/nn;
function albers(lng,lat){const lam=lng*DEG,phi=lat*DEG,rho=Math.sqrt(Cc-2*nn*Math.sin(phi))/nn,th=nn*(lam-l0);
  return[rho*Math.sin(th),rho0-rho*Math.cos(th)];}
function canvasXY(lng,lat){const[x,y]=albers(lng,lat);return[P.oX+(x-P.mnX)*P.sc, P.oY+(P.mxY-y)*P.sc];}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const disc=c=>legend.find(l=>l.code===c)||legend[0];
function el(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}
/* ---- render the slide (canvas coords, then one transform = pixel parity with PPTX) ---- */
function render(){
  const s=$('slide');s.innerHTML='';
  const defs=el('defs');const lg=el('linearGradient',{id:'bg',x1:0,y1:0,x2:1,y2:1});
  lg.appendChild(el('stop',{offset:0,'stop-color':'#FFFFFF'}));lg.appendChild(el('stop',{offset:1,'stop-color':'#F4F4F4'}));
  defs.appendChild(lg);
  const cp=el('clipPath',{id:'mc'});cp.appendChild(el('rect',{x:P.AX,y:P.AY,width:P.AW,height:P.AH}));defs.appendChild(cp);
  s.appendChild(defs);
  s.appendChild(el('rect',{width:1280,height:720,fill:'url(#bg)'}));
  // header
  s.appendChild(el('text',{x:40,y:34,'font-family':'Proxima Nova, Arial','font-size':11,'font-weight':700,'letter-spacing':2.2,fill:'#CD0A1B'},txt.eyebrow));
  s.appendChild(el('text',{x:40,y:63,'font-family':'Proxima Nova, Arial','font-size':25,'font-weight':700,fill:'#1A1A1A'},(txt.qts?'QTS / ':'')+txt.title));
  const im=el('image',{x:1280-40-130,y:16,width:130,height:40});im.setAttributeNS('http://www.w3.org/1999/xlink','href','data:image/png;base64,'+LOGO);s.appendChild(im);
  s.appendChild(el('line',{x1:40,y1:80,x2:1240,y2:80,stroke:'#CD0A1B','stroke-width':3}));
  // map group
  const g=el('g',{'clip-path':'url(#mc)'});
  const gg=el('g',{transform:`translate(${P.TXo},${P.TYo}) scale(${P.S})`});
  D.paths.forEach(d=>gg.appendChild(el('path',{d,fill:'#E9E9E9',stroke:'#CBCBCB','stroke-width':0.8,'stroke-linejoin':'round'})));
  // leaders + cards
  sites.forEach(st=>{
    const[px,py]=pin(st);const cx=px+st.dx, cy=py+st.dy;
    const tx=clamp(px,cx,cx+CW), ty=clamp(py,cy,cy+CH);
    gg.appendChild(el('line',{x1:px,y1:py,x2:tx,y2:ty,stroke:'#AFAFAF','stroke-width':0.9}));
    gg.appendChild(el('circle',{cx:tx,cy:ty,r:2,fill:'#AFAFAF'}));
  });
  sites.forEach(st=>gg.appendChild(card(st)));
  sites.forEach(st=>gg.appendChild(pinG(st)));
  g.appendChild(gg);s.appendChild(g);
  s.appendChild(legendBox());
  s.appendChild(el('text',{x:40,y:698,'font-family':'Proxima Nova, Arial','font-size':9,fill:'#8B8B8B'},txt.footer));
  s.appendChild(el('text',{x:1240,y:698,'text-anchor':'end','font-family':'Proxima Nova, Arial','font-size':9,'font-weight':700,fill:'#8B8B8B'},'Quanta Services \u00b7 Supply Chain'));
  updateChips();
  // Every mutation already routes through render(), so this is the one place
  // autosave has to hook in. Debounced, so a drag saves once at the end.
  scheduleSave();
}
function pin(st){let[x,y]=canvasXY(st.lng,st.lat);return[x+(st.pdx||0),y+(st.pdy||0)];}
function card(st){
  const[px,py]=pin(st);const cx=px+st.dx, cy=py+st.dy;
  const L=disc(st.disc), fut=st.status==='fut';
  const g=el('g',{class:'card-g','data-id':st.id});
  g.appendChild(el('rect',{x:cx,y:cy+2,width:CW,height:CH,rx:6,fill:'#000',opacity:0.10}));
  const r=el('rect',{x:cx,y:cy,width:CW,height:CH,rx:6,fill:'#fff',stroke:L.color,'stroke-width':1.2});
  if(fut)r.setAttribute('stroke-dasharray','4 3');
  g.appendChild(r);
  g.appendChild(el('rect',{x:cx,y:cy,width:4,height:CH,fill:L.color}));
  g.appendChild(el('text',{x:cx+11,y:cy+14,'font-family':'Proxima Nova, Arial','font-size':11.5,'font-weight':700,fill:'#1A1A1A'},st.opu));
  g.appendChild(el('text',{x:cx+11,y:cy+26,'font-family':'Proxima Nova, Arial','font-size':9.5,fill:'#4A4A4A'},st.sub||(st.city+(st.st?', '+st.st:''))));
  if(st.id===sel)g.appendChild(el('rect',{x:cx-3,y:cy-3,width:CW+6,height:CH+6,rx:8,fill:'none',stroke:'#F0941C','stroke-width':1.6,'stroke-dasharray':'4 3'}));
  return g;
}
function pinG(st){
  const[px,py]=pin(st);const L=disc(st.disc),fut=st.status==='fut';const g=el('g');
  if(st.ring)g.appendChild(el('circle',{cx:px,cy:py,r:11,fill:'none',stroke:'#F0941C','stroke-width':1.6,'stroke-dasharray':'3 2.4',opacity:.85}));
  g.appendChild(el('circle',{cx:px,cy:py,r:10,fill:'none',stroke:L.color,'stroke-width':1.4,opacity:.28}));
  if(fut)g.appendChild(el('circle',{cx:px,cy:py,r:6,fill:'#fff',stroke:L.color,'stroke-width':2,'stroke-dasharray':'3 2.4'}));
  else if(L.style==='donut')g.appendChild(el('circle',{cx:px,cy:py,r:6,fill:'#fff',stroke:L.color,'stroke-width':2.6}));
  else g.appendChild(el('circle',{cx:px,cy:py,r:6,fill:L.color,stroke:'#fff','stroke-width':1.8}));
  return g;
}

/* ---- collision + auto arrange ---- */
function rects(){return sites.map(st=>{const[px,py]=pin(st);return{id:st.id,x0:px+st.dx,y0:py+st.dy,x1:px+st.dx+CW,y1:py+st.dy+CH};});}
function collisions(){const R=rects();let n=0;
  for(let i=0;i<R.length;i++)for(let j=i+1;j<R.length;j++){const a=R[i],b=R[j];
    if(!(a.x1<=b.x0||b.x1<=a.x0||a.y1<=b.y0||b.y1<=a.y0))n++;}
  return n;}
function autoArrange(){
  let moved=0;
  for(let pass=0;pass<70;pass++){
    const R=rects();let hit=false;
    for(let i=0;i<R.length;i++)for(let j=i+1;j<R.length;j++){
      const a=R[i],b=R[j];
      if(!(a.x1<=b.x0||b.x1<=a.x0||a.y1<=b.y0||b.y1<=a.y0)){
        hit=true;const s=sites.find(x=>x.id===b.id);
        const ox=Math.min(a.x1-b.x0,b.x1-a.x0), oy=Math.min(a.y1-b.y0,b.y1-a.y0);
        if(oy<=ox)s.dy+=(b.y0>=a.y0?1:-1)*(oy+3);else s.dx+=(b.x0>=a.x0?1:-1)*(ox+3);
        moved++;
      }}
    if(!hit)break;
  }
  render();paint();toast(moved?`Moved ${moved} label${moved>1?'s':''} to clear overlaps`:'No overlaps to fix');
}
function updateChips(){
  const cur=sites.filter(s=>s.status==='cur').length, fut=sites.length-cur;
  $('stat').innerHTML=`<b>${sites.length}</b> sites &nbsp;·&nbsp; ${cur} current &nbsp;·&nbsp; ${fut} future`;
  const c=collisions();
  $('coll').innerHTML=c?`<span class="warn">⚑ ${c} label overlap${c>1?'s':''}</span>`:`<span class="ok">✓ no overlaps</span>`;
}
/* ---- drag ---- */
let drag=null;
$('slide').addEventListener('pointerdown',e=>{
  const g=e.target.closest('.card-g');if(!g)return;
  const id=+g.dataset.id, st=sites.find(s=>s.id===id);
  sel=id;const pt=svgPt(e);
  drag={id,ox:pt.x-st.dx*P.S,oy:pt.y-st.dy*P.S};
  g.classList.add('drag');g.setPointerCapture(e.pointerId);paint();render();
});
$('slide').addEventListener('pointermove',e=>{
  if(!drag)return;const st=sites.find(s=>s.id===drag.id);const pt=svgPt(e);
  st.dx=Math.round((pt.x-drag.ox)/P.S);st.dy=Math.round((pt.y-drag.oy)/P.S);
  render();
});
$('slide').addEventListener('pointerup',()=>{if(drag){drag=null;paint();}});
function svgPt(e){const s=$('slide'),r=s.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(1280/r.width),y:(e.clientY-r.top)*(720/r.height)};}
/* ---- rail ---- */
function paint(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.t===tab));
  const p=$('pane');
  if(tab==='sites')p.innerHTML=sitesHTML();
  else if(tab==='legend')p.innerHTML=legendHTML();
  else if(tab==='text')p.innerHTML=textHTML();
  else p.innerHTML=dataHTML();
  wire();
}

  sites.forEach(st=>{
    const L=disc(st.disc);const on=st.id===sel;
    h+=`<div class="site ${on?'sel':''}" data-pick="${st.id}" style="border-left-color:${L.color}">
      <div class="top"><span class="nm">${esc(st.opu)}</span>

      <div class="sf" style="color:${L.color}">${esc(L.label)}</div>`;

    h+=`</div>`;

/* ---- wiring ---- */
function wire(){
  document.querySelectorAll('[data-pick]').forEach(n=>n.addEventListener('click',e=>{
    if(e.target.closest('[data-stop]'))return;
    sel=(sel===+n.dataset.pick)?null:+n.dataset.pick;paint();render();}));
  document.querySelectorAll('[data-f]').forEach(inp=>{
    const st=sites.find(s=>s.id===sel);if(!st)return;
    const f=inp.dataset.f;
    inp.addEventListener('input',()=>{
      if(f==='dx'||f==='dy')st[f]=+inp.value||0;
      else if(f==='ring')st.ring=inp.value==='1';
      else st[f]=inp.value;
      if(f==='city')typeahead(inp);
      render();
      if(f!=='city')refreshRow();
    });
    if(f==='disc'||f==='status')inp.addEventListener('change',()=>{render();paint();});
  });
  document.querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click',()=>{
    const st=sites.find(s=>s.id===sel);if(!st)return;
    const[a,c]=b.dataset.n.split(',').map(Number);
    if(a===0&&c===0){st.dx=0;st.dy=-CH-14;}else{st.dx+=a;st.dy+=c;}
    render();paint();}));
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    sites=sites.filter(s=>s.id!==+b.dataset.del);sel=null;render();paint();toast('Site deleted');}));
  document.querySelectorAll('[data-dup]').forEach(b=>b.addEventListener('click',()=>{
    const st=sites.find(s=>s.id===+b.dataset.dup);
    const c={...st,id:Math.max(...sites.map(s=>s.id))+1,dy:st.dy+CH+8};
    sites.push(c);sel=c.id;render();paint();toast('Site duplicated');}));
  document.querySelectorAll('[data-lc]').forEach(i=>i.addEventListener('input',()=>{legend[+i.dataset.lc].color=i.value;render();}));
  document.querySelectorAll('[data-ll]').forEach(i=>i.addEventListener('input',()=>{legend[+i.dataset.ll].label=i.value;render();}));
  document.querySelectorAll('[data-ls]').forEach(i=>i.addEventListener('change',()=>{legend[+i.dataset.ls].style=i.value;render();}));
  const al=$('addLeg');if(al)al.addEventListener('click',()=>{
    legend.push({code:'D'+(legend.length+1),label:'New discipline',color:'#6E7B8B',style:'solid'});paint();});
  document.querySelectorAll('[data-t]').forEach(i=>i.addEventListener('input',()=>{
    const k=i.dataset.t;txt[k]=(k==='qts')?i.value==='1':i.value;render();}));
  const ej=$('expJson');if(ej)ej.addEventListener('click',()=>dl('qif-footprint.json',
    new Blob([JSON.stringify({sites,legend,txt},null,2)],{type:'application/json'})));
  const ij=$('impJson');if(ij)ij.addEventListener('click',()=>{
    const f=document.createElement('input');f.type='file';f.accept='.json';
    f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);
      if(o.sites)sites=o.sites;if(o.legend)legend=o.legend;if(o.txt)txt=o.txt;
      sel=null;render();paint();toast('Dataset imported');}catch(err){toast('Could not read that file');}};
      r.readAsText(f.files[0]);};f.click();});
}
function refreshRow(){const st=sites.find(s=>s.id===sel);if(!st)return;
  const n=document.querySelector(`[data-pick="${sel}"]`);if(!n)return;
  n.querySelector('.nm').textContent=st.opu;
  n.querySelector('.loc').textContent=st.sub||st.city;}
/* ---- city typeahead ---- */
function typeahead(inp){
  const box=inp.parentElement.querySelector('.sug');
  const q=inp.value.trim().toLowerCase();
  if(q.length<2){box.hidden=true;box.innerHTML='';return;}
  const hits=D.cities.filter(c=>c.c.toLowerCase().startsWith(q)).slice(0,40);
  const also=D.cities.filter(c=>!c.c.toLowerCase().startsWith(q)&&c.c.toLowerCase().includes(q)).slice(0,10);
  const all=[...hits,...also].slice(0,40);
  if(!all.length){box.hidden=true;return;}
  box.hidden=false;
  box.innerHTML=all.map(c=>`<div data-c="${esc(c.c)}" data-s="${c.s}" data-lat="${c.lat}" data-lng="${c.lng}">
    <span>${esc(c.c)}</span><span class="st">${c.s}</span></div>`).join('');
  box.querySelectorAll('div').forEach(d=>d.addEventListener('mousedown',ev=>{
    ev.preventDefault();
    const st=sites.find(s=>s.id===sel);
    st.city=d.dataset.c;st.st=d.dataset.s;st.lat=+d.dataset.lat;st.lng=+d.dataset.lng;
    st.sub=`${st.city}, ${st.st}`;
    box.hidden=true;render();paint();toast(`Placed at ${st.city}, ${st.st}`);
  }));
}
/* ---- export ---- */
function slideSVG(){
  const s=$('slide').cloneNode(true);
  s.querySelectorAll('[stroke="#F0941C"][stroke-dasharray="4 3"]').forEach(n=>{
    if(n.getAttribute('fill')==='none'&&n.getAttribute('rx')==='8')n.remove();});
  s.setAttribute('xmlns',NS);
  return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(s);
}
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
$('svgBtn').addEventListener('click',()=>{dl('qif-map.svg',new Blob([slideSVG()],{type:'image/svg+xml'}));toast('SVG downloaded');});
$('pngBtn').addEventListener('click',()=>{
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=2560;c.height=1440;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,2560,1440);x.drawImage(img,0,0,2560,1440);
    c.toBlob(b=>{dl('qif-map.png',b);toast('PNG downloaded at 2560×1440');});};
  img.onerror=()=>toast('Could not rasterise — use Download SVG');
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(slideSVG())));
});
$('addBtn').addEventListener('click',()=>{
  const id=sites.length?Math.max(...sites.map(s=>s.id))+1:1;
  const c=D.cities.find(x=>x.c==='Houston');
  sites.push({id,opu:'New site',disc:legend[0].code,status:'cur',city:c.c,st:c.s,lat:c.lat,lng:c.lng,
    sub:`${c.c}, ${c.s}`,dx:40,dy:-16,ring:false,pdx:0,pdy:0});
  sel=id;tab='sites';render();paint();
  $('pane').scrollTop=$('pane').scrollHeight;toast('Site added — set the city to place it');

$('autoBtn').addEventListener('click',autoArrange);
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{tab=t.dataset.t;sel=null;paint();render();}));
let tt;function toast(m){const n=$('toast');n.textContent=m;n.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>n.classList.remove('on'),1900);}
/* ---- passphrase gate and saved state ----
   The passphrase is checked by /api/footprint against the QIF_PASSWORD env var,
   so the real one lives on the server and never in this public repo. That same
   call returns the saved dataset, which is how edits survive a reload and follow
   the editor between browsers and machines.

   The SHA-256 digest below is only the fallback for when the site has no
   QIF_PASSWORD set: the editor still opens and still works, it just cannot save.
   Without it, an unconfigured site would lock everyone out entirely. It is
   obfuscation, not security — it keeps the passphrase out of view-source and
   grep, and stops nobody who tries. Once QIF_PASSWORD is set, the server is the
   authority and this path is never taken.

   What none of this hides: the baseline. This page is public and ships the map,
   the city list and the starting 18 sites inline, so the gate protects saved
   state, not the blank slate. */
const PW_SHA256='c74052c4e05539badfeed94c6fa67756e3b65f1f2c2ad4fbde4b43edfebe633f';
const API='/api/footprint';
// The passphrase is held in memory only, never in storage, so it cannot be read
// back out of the browser later. The cost is a re-prompt on reload — cheap now
// that the work itself is saved server-side.
let PW=null, rev=0, persist='off', dirty=false, booted=false, saveArmed=false, conflict=false;
async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function setSave(state,label){
  const n=$('save');n.dataset.s=state;
  const cls=state==='saved'?'ok':(state==='conflict'||state==='off'?'warn':'');
  n.innerHTML=cls?`<span class="${cls}">${label}</span>`:label;
}
const hhmm=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function boot(){
  if(booted)return;booted=true;
  document.body.classList.add('unlocked');
  render();paint();
  // Armed only after the first render, so restoring a saved dataset does not
  // immediately save it back, and the baseline never overwrites a real save.
  saveArmed=true;
}
/* ---- save ---- */
let saveT;
function scheduleSave(){
  if(!saveArmed||persist!=='on'||conflict)return;
  dirty=true;setSave('dirty','• unsaved');
  clearTimeout(saveT);saveT=setTimeout(()=>doSave(false),1200);
}
async function doSave(force){
  if(persist!=='on')return;
  setSave('saving','saving…');
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:PW,data:{sites,legend,txt},rev,force:!!force})});
    const o=await r.json().catch(()=>({}));
    if(r.ok&&o.ok){rev=o.rev;dirty=false;conflict=false;setSave('saved',`✓ saved ${hhmm()}`);return;}
    if(r.status===409){
      // Someone else saved since this page loaded. Autosave stops rather than
      // clobbering them; the chip becomes the deliberate overwrite.
      conflict=true;setSave('conflict','⚑ newer version exists — click to overwrite');
      toast('Someone else saved a newer version. Reload to take theirs, or click the chip to overwrite.');
      return;
    }
    setSave('dirty','• unsaved');toast(o.error||`Could not save (${r.status}).`);
  }catch(e){
    setSave('dirty','• unsaved');toast('Could not reach the server to save.');
  }
}
$('save').addEventListener('click',()=>{if(conflict){conflict=false;doSave(true);}});
/* ---- unlock ---- */
async function unlock(pw){
  // The server is asked first: it holds the real passphrase and the saved state.
  let r=null;
  try{
    r=await fetch(`${API}?password=${encodeURIComponent(pw)}`,{cache:'no-store'});
  }catch(e){
    r=null; // offline or the function is missing — fall through to the local check
  }
  if(r&&r.status===401)return{ok:false,msg:'Wrong passphrase.'};
  if(r&&r.ok){
    const o=await r.json().catch(()=>({}));
    PW=pw;persist='on';rev=Number(o.rev)||0;
    if(o.data&&Array.isArray(o.data.sites)&&o.data.sites.length){
      sites=o.data.sites;
      if(Array.isArray(o.data.legend)&&o.data.legend.length)legend=o.data.legend;
      if(o.data.txt)txt=o.data.txt;
      sel=null;
    }
    boot();
    setSave('saved',o.ts?`✓ saved ${new Date(o.ts).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}`:'✓ synced');
    if(o.data)toast('Loaded the saved slide');
    return{ok:true};
  }
  // No QIF_PASSWORD on the site (503), or the server was unreachable. Check the
  // digest locally so the editor still opens — read-only in the sense that
  // nothing it does will be kept.
  let local=false;
  try{local=await sha256(pw)===PW_SHA256;}
  catch(e){return{ok:false,msg:'This page needs HTTPS to check the passphrase.'};}
  if(!local)return{ok:false,msg:'Wrong passphrase.'};
  persist='off';boot();
  setSave('off','⚑ not saving — edits lost on reload');
  toast('Saving is off: set QIF_PASSWORD on the Netlify site to keep edits. Use Data → Export JSON meanwhile.');
  return{ok:true};
}
$('gateForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=$('gateErr'),btn=e.target.querySelector('button[type=submit]');
  err.textContent='';btn.disabled=true;btn.textContent='Checking…';
  const res=await unlock($('gatePw').value);
  if(!res.ok){err.textContent=res.msg;$('gatePw').select();}
  btn.disabled=false;btn.textContent='Unlock';
});
// A save is in flight or pending, or nothing is being saved at all: either way
// closing now loses work, so say so. Browsers ignore custom text here.
addEventListener('beforeunload',e=>{
  if(!booted)return;
  if(persist!=='on'||dirty||conflict){e.preventDefault();e.returnValue='';}
});
</script></body></html>
