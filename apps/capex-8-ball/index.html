<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>CAPEX 8-Ball</title>
  <style>
    :root{--bg:#0b0f14;--panel:#151b23;--panel2:#1c242e;--line:#2a3441;--text:#eaf1f7;--dim:#93a2b2;--faint:#66757f;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      overscroll-behavior-y:contain;}
    #root{min-height:100vh;min-height:100dvh;}
    button{font-family:inherit;}
    input{font-family:inherit;}

    /* The shake itself: a short, jittery translate + rotate. Deliberately
       ugly-fast so it reads as "someone is rattling this thing". */
    @keyframes ball-shake{
      0%,100%{transform:translate(0,0) rotate(0)}
      10%{transform:translate(-9px,4px) rotate(-5deg)}
      20%{transform:translate(8px,-6px) rotate(5deg)}
      30%{transform:translate(-10px,-3px) rotate(-6deg)}
      40%{transform:translate(9px,5px) rotate(4deg)}
      55%{transform:translate(-6px,-5px) rotate(-3deg)}
      70%{transform:translate(5px,3px) rotate(3deg)}
      85%{transform:translate(-3px,-2px) rotate(-1deg)}
    }
    @keyframes die-rise{
      from{opacity:0;transform:scale(.55) translateY(14px)}
      to{opacity:1;transform:scale(1) translateY(0)}
    }
    @keyframes fade-up{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes swirl{
      0%{opacity:.15;transform:rotate(0) scale(1)}
      50%{opacity:.5;transform:rotate(180deg) scale(1.25)}
      100%{opacity:.15;transform:rotate(360deg) scale(1)}
    }
    @media (prefers-reduced-motion: reduce){
      *{animation-duration:.01ms !important;animation-iteration-count:1 !important;}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Fully self-contained: no sign-in, no network, no backend. -->
  <script src="bundle.js"></script>
</body>
</html>
