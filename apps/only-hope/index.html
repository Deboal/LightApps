<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e14" />
  <title>Only Hope</title>
  <style>
    :root{--bg:#0a0e14;--panel:#141b25;--line:#25313f;--text:#eef4fa;--dim:#8fa0b3;--gold:#ffcf4a;--cyan:#46e0d0;--red:#ff5a52;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-user-select:none;user-select:none;overscroll-behavior:none;}
    #root{position:fixed;inset:0;}
    canvas{display:block;touch-action:none;}
    button{font-family:inherit;}
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Self-contained: no sign-in, no network, no store. The whole point is that
       what you see in the ad is what runs. -->
  <script src="bundle.js"></script>
</body>
</html>
