<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vitamin Reorder</title>
  <style>
    :root{--bg:#0e1116;--panel:#171d26;--panel2:#1e2632;--line:#28323f;--text:#e9eef4;
          --dim:#8b98a8;--faint:#5d6b7c;--accent:#f5a524;--good:#3ecf8e;--warn:#e2a03f;--bad:#e5604d;}
    *{box-sizing:border-box;}
    body{margin:0;width:380px;max-height:580px;overflow-y:auto;background:var(--bg);color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .wrap{padding:16px 14px 14px;}
    h1{font-size:19px;letter-spacing:-.02em;margin:2px 0 2px;}
    .kicker{font-size:10px;letter-spacing:.2em;color:var(--faint);font-weight:700;}
    .sub{color:var(--dim);font-size:12px;line-height:1.5;margin:4px 0 14px;}
    .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
    .ghost{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;
           padding:5px 10px;font-size:11.5px;cursor:pointer;font-weight:600;font-family:inherit;}
    .count{color:var(--faint);font-size:11.5px;}
    .row{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
         border-radius:11px;padding:10px 11px;margin-bottom:7px;}
    .row.on{background:#1a2430;border-color:#3b5570;}
    .box{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);
         background:transparent;color:#20160a;font-size:13px;font-weight:900;line-height:1;
         cursor:pointer;padding:0;font-family:inherit;}
    .box.on{background:var(--accent);border-color:var(--accent);}
    .name{font-weight:650;font-size:13.5px;letter-spacing:-.01em;}
    .meta{color:var(--dim);font-size:11px;margin-top:2px;}
    .note{color:var(--faint);font-size:10.5px;font-style:italic;margin-top:2px;}
    .badge{background:#2a2620;color:#c9a15e;border-radius:4px;padding:1px 5px;font-size:9px;
           font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-left:5px;vertical-align:1px;}
    .badge.none{background:#3a2a1a;color:var(--accent);}
    .qty{display:flex;align-items:center;gap:5px;flex:0 0 auto;}
    .step{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);
          color:var(--text);font-size:14px;line-height:1;cursor:pointer;padding:0;font-family:inherit;}
    .n{min-width:12px;text-align:center;font-weight:700;font-size:13px;}
    .cta{width:100%;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:800;
         cursor:pointer;background:var(--accent);color:#20160a;font-family:inherit;margin-top:4px;}
    .cta[disabled]{background:var(--panel2);color:var(--faint);cursor:default;}
    .foot{color:var(--faint);font-size:10.5px;line-height:1.55;margin-top:10px;}
    .progress{display:flex;gap:2px;margin:10px 0 12px;}
    .tick{flex:1;height:3px;border-radius:2px;background:var(--line);}
    .tick.done{background:var(--good);}
    .tick.now{background:var(--accent);}
    .res{display:flex;gap:8px;align-items:baseline;font-size:12px;padding:5px 0;
         border-bottom:1px solid var(--line);}
    .res:last-child{border-bottom:none;}
    .dot{flex:0 0 auto;font-size:11px;}
    .ok{color:var(--good);} .warn{color:var(--warn);} .bad{color:var(--bad);}
    .rname{flex:1;color:var(--text);}
    .rdetail{color:var(--faint);font-size:10.5px;margin-top:1px;}
    a{color:var(--accent);}
    .panel{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:12px;}
    .panel.done{border-color:var(--good);}
    .add{width:100%;background:transparent;border:1px dashed var(--line);color:var(--dim);
         border-radius:11px;padding:11px;font-size:12.5px;cursor:pointer;font-family:inherit;margin-bottom:7px;}
    input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
          border-radius:8px;padding:9px 10px;font-size:13px;outline:none;margin-bottom:6px;font-family:inherit;}
  </style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
