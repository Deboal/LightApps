<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seating Board</title>
<style>
  :root{
    --concrete:#EDEEF0;
    --surface:#FFFFFF;
    --hairline:#C9CDD3;
    --hairline-soft:#DFE3E7;
    --ink:#14181C;
    --ink-mute:#6B7480;
    --blueprint:#0F5FA6;
    --wash-1:#EEF4FA;
    --wash-2:#D9E7F3;
    --flag:#C2410C;
    --flag-wash:#FBEDE5;
    --ok:#0F7A4A;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--concrete);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute)}

  /* ---------- title block ---------- */
  .titleblock{background:var(--surface);border-bottom:1px solid var(--hairline);padding:12px 18px;display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-end;justify-content:space-between;position:sticky;top:0;z-index:30}
  .titleblock h1{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.02em;margin:2px 0 0;text-transform:uppercase}
  .titleblock .sub{color:var(--ink-mute);font-size:12px;margin-top:2px}
  .tally{display:flex;border:1px solid var(--hairline);flex-wrap:wrap}
  .tally div{padding:5px 13px;border-right:1px solid var(--hairline);min-width:70px}
  .tally div:last-child{border-right:0}
  .tally .n{font-family:var(--mono);font-size:18px;line-height:1.15;display:block}
  .tally .flagged{background:var(--flag-wash)}
  .tally .flagged .n{color:var(--flag)}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  /* Scoped to the board so the shared AuthGate sign-in keeps its own styling. */
  .board-root button{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;background:var(--surface);color:var(--ink);border:1px solid var(--hairline);border-radius:0;cursor:pointer}
  .board-root button:hover{border-color:var(--ink)}
  .board-root button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .board-root button.primary:hover{background:var(--blueprint);border-color:var(--blueprint)}
  .board-root button:focus-visible,.board-root [tabindex]:focus-visible,.board-root input:focus-visible,.board-root textarea:focus-visible,.board-root select:focus-visible{outline:2px solid var(--blueprint);outline-offset:2px}
  .zoom{display:flex;align-items:center;gap:7px;border:1px solid var(--hairline);padding:4px 9px;background:var(--surface)}
  .zoom input[type=range]{width:88px;accent-color:var(--blueprint)}

  /* ---------- sync status ---------- */
  .sync{display:flex;align-items:center;gap:6px;border:1px solid var(--hairline);padding:6px 9px;background:var(--surface);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);white-space:nowrap}
  .sync .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-mute);flex:0 0 auto}
  .sync[data-state="saved"]{color:var(--ok)} .sync[data-state="saved"] .dot{background:var(--ok)}
  .sync[data-state="saving"]{color:var(--blueprint)} .sync[data-state="saving"] .dot{background:var(--blueprint)}
  .sync[data-state="error"],.sync[data-state="offline"]{color:var(--flag);border-color:var(--flag);background:var(--flag-wash)}
  .sync[data-state="error"] .dot,.sync[data-state="offline"] .dot{background:var(--flag)}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:264px 1fr;align-items:start}
  .shell.collapsed{grid-template-columns:0 1fr}
  .shell.collapsed .roster{display:none}
  @media (max-width:900px){.shell,.shell.collapsed{grid-template-columns:1fr}.shell.collapsed .roster{display:block}}

  .roster{background:var(--surface);border-right:1px solid var(--hairline);padding:14px;position:sticky;top:68px;max-height:calc(100vh - 68px);overflow:auto}
  @media (max-width:900px){.roster{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--hairline)}}
  .roster h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono);margin:0 0 9px;font-weight:600}
  .tabs{display:flex;margin-bottom:9px;border:1px solid var(--hairline)}
  .tabs button{flex:1;border:0;border-right:1px solid var(--hairline);background:transparent}
  .tabs button:last-child{border-right:0}
  .tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
  .board-root input[type=text],.board-root textarea,.board-root select{width:100%;font-family:var(--sans);font-size:13px;padding:7px 8px;border:1px solid var(--hairline);background:#fff;color:var(--ink)}
  .pool{margin-top:11px;display:flex;flex-direction:column;gap:4px;min-height:76px;padding:6px;border:1px dashed var(--hairline)}
  .pool.is-over{border-color:var(--blueprint);background:var(--wash-1)}
  .empty{color:var(--ink-mute);font-size:12px;padding:9px 4px}
  .chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--hairline);border-left:3px solid var(--ink-mute);padding:4px 7px;cursor:grab;font-size:12.5px;line-height:1.3}
  .chip:hover{border-color:var(--ink)}
  .chip[data-placed="yes"]{border-left-color:var(--blueprint)}
  .chip.is-selected{border-color:var(--blueprint);background:var(--wash-1);border-left-color:var(--blueprint)}
  .chip .nm{overflow-wrap:anywhere}
  .chip .dept{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);flex:0 0 auto}
  .chip .where{font-family:var(--mono);font-size:10px;color:var(--blueprint);margin-left:auto;flex:0 0 auto}
  .chip .drop-x{font-family:var(--mono);font-size:12px;color:var(--ink-mute);background:none;border:0;padding:0 1px;cursor:pointer;letter-spacing:0;margin-left:auto;flex:0 0 auto}
  .chip .drop-x:hover{color:var(--flag)}

  /* ---------- plan ---------- */
  .plan{padding:14px 0 46px;overflow-x:auto}
  .canvas{padding:0 18px}
  /* One address line per building — the board now holds more than one site. */
  .site-head{padding:0 0 3px;margin-top:26px}
  .canvas > .site-head:first-child{margin-top:0}
  .band-label{display:flex;align-items:baseline;gap:11px;padding:0 0 5px;border-bottom:1px solid var(--ink);margin-bottom:9px;flex-wrap:wrap}
  .band-label h3{font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;margin:0;font-weight:600}
  .band-label .meta{margin-left:auto}
  .band-label .short{color:var(--flag)}
  .row{display:flex;align-items:stretch;gap:0;margin-bottom:0}

  .room{background:var(--surface);border:1px solid var(--hairline);border-right:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .row .room:last-of-type{border-right:1px solid var(--hairline)}
  .room.support{background:#F5F6F8}
  .room.est{border-style:dashed}
  .room.fill-part{background:var(--wash-1)}
  .room.fill-full{background:var(--wash-2)}
  .room.over-cap{background:var(--flag-wash);border-color:var(--flag);z-index:2}
  .room.is-over{box-shadow:inset 0 0 0 2px var(--blueprint)}
  .room-head{padding:4px 5px 3px;border-bottom:1px solid var(--hairline-soft);flex:0 0 auto}
  .tag{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
  .room.support .tag{color:var(--ink-mute)}
  .room-name{font-size:10.5px;line-height:1.2;color:var(--ink);overflow-wrap:anywhere}
  .room-sf{font-family:var(--mono);font-size:9px;color:var(--ink-mute);letter-spacing:.04em;white-space:nowrap}
  .seats{padding:4px;display:flex;flex-direction:column;gap:3px;flex:1 1 auto;min-height:0;overflow:auto}
  .seats .chip{font-size:11.5px;padding:3px 5px;border-left-color:var(--blueprint)}
  .slot{border:1px dashed var(--hairline);font-family:var(--mono);font-size:9px;color:var(--ink-mute);letter-spacing:.06em;padding:3px 5px;flex:0 0 auto}
  .room-foot{display:flex;align-items:center;gap:4px;padding:3px 4px;border-top:1px solid var(--hairline-soft);font-family:var(--mono);font-size:9px;color:var(--ink-mute);letter-spacing:.04em;flex:0 0 auto}
  .room-foot button{padding:0 4px;font-size:11px;letter-spacing:0;line-height:1.35}
  .cap-n{min-width:11px;text-align:center;color:var(--ink)}

  /* ---------- plan mode: rooms carry their own x/y/w/h ---------- */
  .plan-canvas{position:relative;background:var(--surface);border:1px solid var(--ink);margin-bottom:2px}
  .plan-canvas.approx{border-style:dashed;border-color:var(--flag)}
  .plan-canvas .room.placed{position:absolute;border-right:1px solid var(--hairline)}
  .plan-canvas .room.placed.est{border-style:dashed}
  .plan-canvas .room.over-cap{border-color:var(--flag)}
  /* A one-walled open area. Which edge is the wall wasn't stated, so no single
     side is drawn solid — the dotted outline says "open", not "enclosed". */
  .plan-canvas .room.placed.open{border-style:dotted;border-width:2px;border-color:var(--blueprint);
    background-image:repeating-linear-gradient(45deg,rgba(15,95,166,.07) 0 6px,transparent 6px 12px)}
  .room.open .tag::after{content:" OPEN";font-size:8px;letter-spacing:.1em;color:var(--blueprint)}
  /* Circulation — hallways and stairs. Reads as the corridor band does, and
     carries no room number or seat stepper. */
  .plan-canvas .room.placed.circ{background:repeating-linear-gradient(45deg,#EAEDF0 0 4px,#F3F5F6 4px 9px);
    border-style:solid;border-color:var(--hairline)}
  .room.circ .room-head{border-bottom:0;background:transparent}
  .room.circ .room-name{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute)}
  /* Empty circulation shows no seat list. It still shows anyone standing in it:
     a room reclassified as a hallway must not make its occupants vanish. */
  .room.circ .seats:empty{display:none}
  /* Traced floors are shallower than B100's 14', so cards are short. Drop the
     area line first, then tighten everything that competes with the seats —
     the seats are the point of the card, and a two-seat room that can only
     show one seat is the board failing at its one job. */
  .room.compact .room-sf{display:none}
  .room.compact .room-head{padding:2px 4px 2px}
  .room.compact .room-name{font-size:9.5px}
  .room.compact .room-foot{padding:1px 3px}
  .room.compact .seats{padding:2px 3px;gap:2px}
  .room.compact .seats .chip{font-size:10.5px;padding:1px 4px;line-height:1.3}
  .room.compact .slot{padding:1px 4px}
  /* Tighter still: the code and the name share one line, so the seats get the
     row back. Reached only when even the compact head would squeeze a seat out. */
  .room.tight .room-head{display:flex;align-items:baseline;gap:5px;padding:1px 4px;min-width:0}
  .room.tight .room-name{font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Long names shorten rather than wrap into a second line that gets clipped. */
  .room .chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .stair{background:repeating-linear-gradient(90deg,var(--hairline) 0 1px,transparent 1px 6px),#F5F6F8;border:1px solid var(--hairline);border-right:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
  .stair span{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--ink-mute);writing-mode:vertical-rl;transform:rotate(180deg)}
  .existing{background:repeating-linear-gradient(45deg,#E4E7EA 0 3px,#EDEEF0 3px 7px);border:1px dashed var(--hairline);display:flex;align-items:center;padding:6px;flex:0 0 128px}
  .existing span{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--ink-mute);line-height:1.4}

  .corridor{border:1px solid var(--hairline);border-top:0;background:repeating-linear-gradient(45deg,#EAEDF0 0 4px,#F3F5F6 4px 9px);display:flex;align-items:center;padding-left:8px;margin-bottom:20px}
  .corridor span{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink-mute)}
  .hangar{border:1px solid var(--hairline);background:var(--surface);display:flex;align-items:center;padding:10px 8px;margin-bottom:8px}
  .hangar span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-mute)}

  .ruler{position:relative;height:26px;border-top:1px solid var(--ink);margin-top:2px}
  .tick{position:absolute;top:0;width:1px;height:5px;background:var(--ink-mute)}
  .tick.major{height:9px;background:var(--ink)}
  .tick-lbl{position:absolute;top:10px;font-family:var(--mono);font-size:9px;color:var(--ink-mute);transform:translateX(-50%)}
  .overall{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink);text-align:center;border-top:1px solid var(--hairline);padding-top:4px}

  .legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:12px 18px 0;align-items:center}
  .key{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-mute);text-transform:uppercase}
  .sw{width:16px;height:11px;border:1px solid var(--hairline);display:inline-block}
  .sw.part{background:var(--wash-1)} .sw.full{background:var(--wash-2)}
  .sw.over{background:var(--flag-wash);border-color:var(--flag)}
  .sw.sup{background:#F5F6F8} .sw.dash{border-style:dashed;background:#fff}

  .note{background:var(--surface);border:1px solid var(--hairline);border-left:3px solid var(--blueprint);padding:11px 13px;font-size:12.5px;margin:16px 18px 0;max-width:820px}
  .note strong{font-weight:600}
  .note ul{margin:6px 0 0;padding-left:18px}
  .note li{margin-bottom:3px}

  dialog{border:1px solid var(--ink);padding:0;max-width:520px;width:92vw;background:var(--surface)}
  dialog::backdrop{background:rgba(20,24,28,.42)}
  .dlg-body{padding:17px}
  .dlg-body h4{margin:0 0 4px;font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  .dlg-body p{color:var(--ink-mute);font-size:12.5px;margin:0 0 11px}
  .dlg-row{display:flex;gap:8px;margin-bottom:8px}
  .dlg-row label{flex:1;font-size:12px;color:var(--ink-mute)}
  .dlg-msg{margin:9px 0 0;padding:7px 9px;border-left:3px solid var(--flag);background:var(--flag-wash);color:var(--ink);font-size:12.5px}
  .dlg-foot{display:flex;justify-content:flex-end;gap:6px;padding:11px 17px;border-top:1px solid var(--hairline);background:#F5F6F8}

  /* Alex reviews this on a tablet. The seat steppers are 16px on a mouse,
     which is fine to click and not fine to tap, so give them a real target
     where the pointer is coarse. Seats scroll if the card gets tight. */
  @media (pointer:coarse){
    .board-root .room-foot{padding:4px 5px;gap:8px}
    .board-root .room-foot button{min-width:30px;min-height:30px;font-size:15px}
    .board-root .chip .drop-x{min-width:28px;min-height:24px;font-size:16px}
    .board-root .toolbar button{padding:11px 13px}
    .board-root .tabs button{padding:11px 10px}
  }

  @media print{
    .roster,.toolbar,.room-foot{display:none}
    .titleblock{position:static}
    .shell,.shell.collapsed{display:block;grid-template-columns:1fr}
    .plan{overflow:visible}
  }
  @media (prefers-reduced-motion:no-preference){.chip{transition:border-color .12s ease,background .12s ease}}
</style>
</head>
<body>
  <div id="root"></div>
  <!-- Shared Supabase config is bundled in via shared/config.js. No CDN calls. -->
  <script src="bundle.js"></script>
</body>
</html>
