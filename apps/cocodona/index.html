<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14100c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Cocodona 250 — Crew &amp; Pacer Brief</title>
  <!-- Inline so there is no second request: this brief is meant to work with the
       radio off, and an unresolved /favicon.ico is a 404 on every load. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314100c'/%3E%3Cpath d='M2 24 L9 13 L14 19 L20 7 L30 24 Z' fill='%23c8873f'/%3E%3C/svg%3E" />
  <style>
    /* Palette mirrors shared values in src/theme.js. Kept in sync by hand: this
       is the pre-bundle chrome, so it cannot import from the module. */
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;background:#14100c;color:#f2e6cf;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-text-size-adjust:100%;}
    #root{min-height:100vh;min-height:100dvh;}
    button,input,select{font-family:inherit;}
    /* Reset the iOS chrome on text fields and selects only. Applying this to
       every input collapses checkboxes to zero size and makes them invisible. */
    input[type="text"],input[type="email"],input:not([type]),select{
      -webkit-appearance:none;appearance:none;}
    input[type="checkbox"]{accent-color:#c8873f;width:16px;height:16px;}
    table{-webkit-text-size-adjust:100%;}
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Self-contained by design: no backend, no auth, no network. Crew and pacers
       open this on a phone in Arizona backcountry with one bar or none. -->
  <script src="bundle.js"></script>
</body>
</html>
