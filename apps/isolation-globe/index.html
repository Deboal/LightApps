<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070c" />
  <meta name="description" content="An interactive globe of how isolated every piece of land on Earth is — and how that changes when you raise the bar to only count ground above a given elevation." />
  <title>Isolation Globe</title>
  <style>
    :root{color-scheme:dark;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;height:100%;overflow:hidden;background:#05070c;color:#e8eff7;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;}
    #root{height:100%;}
    button{font-family:inherit;}
    /* The elevation slider is the main control, so give it a real tap target. */
    input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:26px;}
    input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#1e2a3d;}
    input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#1e2a3d;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
      width:22px;height:22px;border-radius:50%;background:#4fd0c4;border:3px solid #0d1420;margin-top:-9px;cursor:pointer;}
    input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;
      background:#4fd0c4;border:3px solid #0d1420;cursor:pointer;}
    input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(79,208,196,.35);}
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Self-contained: the whole dataset is assets/terrain.png, and every
       distance is computed in the browser. No backend, no sign-in. -->
  <script src="bundle.js"></script>
</body>
</html>
