<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#140f1c" />
  <title>Excuse-O-Matic</title>
  <style>
    :root{--bg:#140f1c;--panel:#1f1830;--line:#372a4d;--text:#f6f0ff;--dim:#a897c4;--accent:#ff8a3d;--accent2:#ffd166;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    #root{min-height:100vh;min-height:100dvh;}
    button{font-family:inherit;}
    ::-webkit-scrollbar{height:0;width:0;}
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Fully self-contained: no backend, no sign-in. Works on airplane mode. -->
  <script src="bundle.js"></script>
</body>
</html>
