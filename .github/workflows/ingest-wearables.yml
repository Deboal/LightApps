name: Ingest wearables

# Pulls WHOOP and Garmin into the coach app's Supabase rows.
#
# Runs at 13:10 UTC, which is 06:10 in Arizona (MST, UTC-7, no DST) — after the
# night's sleep has synced and WHOOP has computed recovery, and before the 4 AM
# Pacific training window would want an answer. A 7-day window rather than just
# yesterday, because WHOOP recalculates recovery when a late nap lands and Garmin
# backfills when a watch syncs days later.

on:
  schedule:
    - cron: "10 13 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days to backfill (default 7, max useful ~30)"
        required: false
        default: "7"

concurrency:
  # Never let a manual backfill race the nightly run; they write the same rows.
  group: ingest-wearables
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Ingest
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COACH_USER_EMAIL: ${{ secrets.COACH_USER_EMAIL }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
          INGEST_DAYS: ${{ github.event.inputs.days || '7' }}
        run: python main.py
